[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dreamer"
version = "0.1.0"
description = "Lightweight dreaming & memory management engine for Claude Code and coding agents"
readme = "README.md"
authors = [
    { name = "yulmucoffee" }
]
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.20.0",
]

[project.scripts]
dreamer = "dreamer.cli:main"
