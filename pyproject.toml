[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dreamer"
version = "0.2.0"
description = "Offline memory consolidation (dreaming) for Claude Code projects"
readme = "README.md"
authors = [
    { name = "yulmucoffee" }
]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.6.0",
    "tomli>=1.1; python_version < '3.11'",
]

[project.scripts]
dreamer = "dreamer.cli:main"

[tool.setuptools]
packages = ["dreamer"]
